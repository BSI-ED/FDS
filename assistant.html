<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA - Message Vocal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a url('https://www.cite-sciences.fr/fileadmin/fileadmin_CSI/fichiers/vous-etes/professionnel/presse-media/photos/JIS26_40x60_sslogospatners.jpg') center center no-repeat fixed;
            background-size: auto 100%;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #tapIndicator {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #tapIndicator.visible {
            opacity: 1;
        }

        .tap-circle {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .tap-icon {
            font-size: 50px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .tap-text {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                           0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            50% {
                transform: scale(1.15);
                box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6),
                           0 0 0 30px rgba(255, 255, 255, 0);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body onclick="handleTap()">
    <div id="tapIndicator">
        <div class="tap-circle">
            <div class="tap-icon">👆</div>
        </div>
        <div class="tap-text">Tapez sur l'écran</div>
    </div>

    <script>
        const texte = [
            "Bonjour…",
            "Je suis votre assistant IA.",
            "Approchez-vous du support interactif pour commencer l'exploration.",
            "Bonne découverte !"
        ];

        let deja_lu = false;
        const indicator = document.getElementById('tapIndicator');

        function lireMessage() {
            if (deja_lu) return;
            
            deja_lu = true;
            
            // Cacher l'indicateur
            indicator.classList.remove('visible');
            setTimeout(() => {
                indicator.classList.add('hidden');
            }, 500);

            // Lire le message
            const utterance = new SpeechSynthesisUtterance(texte.join(' '));
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            window.speechSynthesis.speak(utterance);
        }

        function handleTap() {
            lireMessage();
        }

        // Afficher l'indicateur après un court délai
        window.addEventListener('load', function() {
            setTimeout(function() {
                indicator.classList.add('visible');
            }, 800);
        });
    </script>
</body>
</html>
