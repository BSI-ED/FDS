<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant IA - Message Vocal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a url('https://www.cite-sciences.fr/fileadmin/fileadmin_CSI/fichiers/vous-etes/professionnel/presse-media/photos/JIS26_40x60_sslogospatners.jpg') center center no-repeat fixed;
            background-size: auto 100%;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Page affichant uniquement le poster en arrière-plan -->
    <!-- La synthèse vocale se lance automatiquement au chargement -->
    
    <script>
        const texte = [
            "Bonjour…",
            "Je suis votre assistant IA.",
            "Approchez-vous du support interactif pour commencer l'exploration.",
            "Bonne découverte !"
        ];

        let synthese = window.speechSynthesis;

        function lireMessage() {
            if (synthese.speaking) {
                return;
            }

            const utterance = new SpeechSynthesisUtterance(texte.join(' '));
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            synthese.speak(utterance);
        }

        // Lecture automatique au chargement de la page
        window.addEventListener('load', function() {
            setTimeout(lireMessage, 500);
        });
    </script>
</body>
</html>
