<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant IA – Bibliothèque</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  #startScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  #startScreen h1 {
    font-size: 22px;
    margin-bottom: 20px;
  }

  #startScreen .icon {
    font-size: 60px;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0.8; }
  }

  #content {
    display: none;
  }
</style>
</head>

<body>

<!-- Écran de démarrage -->
<div id="startScreen">
  <div class="icon">🔊</div>
  <h1>Touchez l’écran pour commencer</h1>
</div>

<!-- Contenu principal -->
<div id="content">
  <h1>Bienvenue à la bibliothèque</h1>
  <p>Votre assistant IA vous parle…</p>
</div>

<audio id="audio" src="audio.mp3" preload="auto"></audio>

<script>
  const startScreen = document.getElementById("startScreen");
  const content = document.getElementById("content");
  const audio = document.getElementById("audio");

  function startExperience() {
    startScreen.style.display = "none";
    content.style.display = "block";
    audio.play();
  }

  // Un seul geste suffit (mobile + desktop)
  startScreen.addEventListener("click", startExperience);
  startScreen.addEventListener("touchstart", startExperience, { once: true });
</script>

</body>
</html>
