<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Assistant IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a url('https://www.cite-sciences.fr/fileadmin/fileadmin_CSI/fichiers/vous-etes/professionnel/presse-media/photos/JIS26_40x60_sslogospatners.jpg') center center no-repeat fixed;
            background-size: auto 100%;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding-left: 50px;
        }

        #qrcode {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #qrcode canvas {
            display: block;
        }
    </style>
    <!-- Bibliothèque QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- QR Code positionné à gauche sur l'image de fond -->
    <div id="qrcode"></div>

    <script>
        // URL cible pour le QR code
        const targetUrl = 'https://bsi-ed.github.io/FDS/assistant.html';

        // Générer le QR code
        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
